{% load static %}
<div class="sticky-top">
	<div class="shop-account">
		<div class="account-detail text-center">
			<div class="my-image">
				<img alt="{{ user.username }}" src="{% if user.avatar %}{{ user.avatar.url }}{% else %}{% static 'images/default-avatar.svg' %}{% endif %}">
			</div>
			<div class="account-title">
				<div class="">
					<h4 class="m-b5">{{ user.get_full_name|default:user.username }}</h4>
					<p class="m-b0">{{ user.email }}</p>
				</div>
			</div>
		</div>
		<ul class="account-list">
			<li>
				<a href="{% url 'accounts:profile' %}"{% if active == 'profile' %} class="active"{% endif %}><i class="far fa-user" aria-hidden="true"></i>
				<span>Profile</span></a>
			</li>
			<li>
				<a href="{% url 'wishlist:wishlist' %}"{% if active == 'wishlist' %} class="active"{% endif %}><i class="far fa-heart" aria-hidden="true"></i>
				<span>Wishlist</span></a>
			</li>
			<li>
				<a href="{% url 'cart:cart' %}"{% if active == 'cart' %} class="active"{% endif %}><i class="flaticon-shopping-cart-1"></i>
				<span>Shopping Cart</span></a>
			</li>
			<li>
				<form method="post" action="{% url 'accounts:logout' %}">
					{% csrf_token %}
					<button type="submit" class="account-logout"><i class="fas fa-sign-out-alt" aria-hidden="true"></i>
					<span>Log Out</span></button>
				</form>
			</li>
		</ul>
	</div>
</div>
