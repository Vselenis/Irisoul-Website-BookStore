{% extends 'base.html' %}
{% load static %}

{% block header %}{% endblock %}

{% block content %}
	<!-- construction-page -->
	<div class="under-construct">
		<img src="{% static 'images/thank-you.jpg' %}" class="uc-bg" alt="Thank you"/>
		<div class="inner-box position-relative">
			<div class="logo-header logo-dark">
				<a href="{% url 'core:home' %}"><img src="{% static 'images/logo.png' %}" alt="logo"></a>
			</div>
			<div class="dz-content">
				<h2 class="dz-title">Thank you <br/>for your <span class="text-primary">order</span></h2>
				<p>{% if item_count == 1 %}The product is{% else %}The products are{% endif %} currently unavailable.</p>
				<a href="{% url 'products:book-list' %}" class="btn btn-primary btnhover m-t30">Continue Shopping</a>
			</div>
		</div>
	</div>
	<!-- construction-page -->
{% endblock %}

{% block footer %}{% endblock %}
