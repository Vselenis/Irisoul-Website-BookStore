<div class="{{ classes }}">
	<input class="form-check-input" type="checkbox" id="bookmark-{{ product.pk }}"{% if user.is_authenticated %} data-wishlist-add="{% url 'wishlist:add' product.pk %}" data-wishlist-remove="{% url 'wishlist:remove' product.pk %}"{% if product.pk in wishlist_product_ids %} checked{% endif %}{% else %} data-wishlist-login="{% url 'accounts:login' %}"{% endif %}{% if quantity_input %} data-wishlist-quantity="{{ quantity_input }}"{% endif %}>
	<label class="form-check-label" for="bookmark-{{ product.pk }}">
		<i class="flaticon-heart"></i>
	</label>
</div>
